# red_ref_dense  (priority tier 1)
# Dense attention-comm on the communication-critical control. This is the positive control D-011 makes a precondition for any headline.
# Generated by scripts/make_reduced_design_configs.py -- edit there, not here.

run_name: red_ref_dense
env:
  name: simple_reference
  n_agents: 2
  max_cycles: 25
  local_ratio: 0.5
model:
  hidden: 64
  use_comm: true
  msg_dim: 16
  attn_mode: dense
trainer:
  total_steps: 2000000
  n_envs: 32
  rollout_len: 25
  ppo_epochs: 10
  n_minibatches: 1
  lr: 0.0007
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_clip: 100.0
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  per_agent_reward: true
  advantage_norm: true
  eval_episodes: 32
  log_interval_steps: 4000
  eval_interval_steps: 40000
  device: cuda
  out_dir: results
