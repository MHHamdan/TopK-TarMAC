run_name: mappo_mpe_n6_topk

env:
  n_agents: 6
  max_cycles: 25
  local_ratio: 0.5

model:
  hidden: 64
  use_comm: true
  msg_dim: 16
  attn_mode: adaptive_topk

trainer:
  total_steps: 1_000_000
  n_envs: 32
  rollout_len: 25
  ppo_epochs: 10
  n_minibatches: 1
  lr: 7.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_clip: 100.0
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  per_agent_reward: true
  eval_episodes: 32
  log_interval_steps: 4_000
  eval_interval_steps: 40_000
  device: cuda
  out_dir: results
